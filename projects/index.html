<!DOCTYPE html>
<html lang="en" class="no-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — Artem Gusev</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../style.css" />
  <!-- Prism.js syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <!-- Theme init: runs before first paint to prevent flash -->
  <script>
    {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
      document.documentElement.style.visibility = 'hidden';
    }
  </script>
</head>
<body>

  <div class="project-page">

    <div class="project-topbar">
      <a href="../" class="project-back">← Back to Portfolio</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>

    <h1 class="project-title" id="proj-title"></h1>
    <div class="project-tech" id="proj-tech"></div>

    <div class="project-media" id="proj-media"></div>

    <p class="project-desc" id="proj-desc"></p>

    <div class="project-links" id="proj-links"></div>

    <div class="project-features" id="proj-features"></div>

  </div>

  <footer id="site-footer">
    <div class="footer-inner">
      <p class="footer-copy">&copy; 2026 Artem Gusev</p>
    </div>
  </footer>

  <script src="../projects.js"></script>
  <script src="./project.js"></script>
</body>
</html>
