<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero — Scroll Animation Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg:               #1c1917;
      --color-accent:           #c86820;
      --color-accent-highlight: #f4a261;
      --color-border:           #3d3228;
      --color-text:             #fdf0e6;
      --color-text-muted:       #a8917a;
      --font-display: 'Rajdhani', sans-serif;
      --font-body:    'Inter', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--color-bg);
      font-family: var(--font-body);
      color: var(--color-text);
    }

    /* ---- HEADER ---- */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 clamp(1rem, 5vw, 2rem);
      z-index: 100;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }

    header.scrolled { border-color: var(--color-border); }

    /* Invisible anchor — just marks where the logo text should land */
    .logo-anchor {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    nav {
      margin-left: auto;
      display: flex;
      gap: 2rem;
    }

    nav a {
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    /* ---- HERO ---- */
    #hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 clamp(2rem, 10vw, 8rem);
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /*
      Invisible placeholder — occupies the exact space the name takes up
      so the layout doesn't shift when the animated name flies off.
    */
    .name-placeholder {
      font-family: var(--font-display);
      font-size: clamp(2.75rem, 7vw, 5rem);
      font-weight: 700;
      line-height: 1;
      visibility: hidden;
      user-select: none;
      white-space: nowrap;
    }

    .hero-title {
      font-family: var(--font-body);
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 600;
      color: var(--color-accent-highlight);
      margin-top: 0.4rem;
    }

    .cta-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 2.5rem;
    }

    .btn {
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }

    .btn-primary { background: var(--color-accent); color: #1c1917; }
    .btn-ghost   { background: transparent; color: var(--color-text); border: 1px solid var(--color-border); }

    /* ---- ANIMATED NAME (fixed overlay) ---- */
    .name-animated {
      position: fixed;
      top: 0;
      left: 0;
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      z-index: 200;
      /* JS drives left, top, font-size, color */
    }

    /* ---- FAKE SECTIONS BELOW ---- */
    .fake-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--color-border);
      color: var(--color-text-muted);
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <header id="header">
    <!-- Invisible anchor: defines where the animated name lands -->
    <span class="logo-anchor" aria-hidden="true">Artem Gusev</span>
    <nav>
      <a href="#">Projects</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section id="hero">
    <div class="hero-content">
      <!-- Invisible placeholder keeps layout stable -->
      <div class="name-placeholder" aria-hidden="true">Artem Gusev</div>
      <p class="hero-title">Game Developer</p>
      <div class="cta-group">
        <a class="btn btn-primary">View My Work</a>
        <a class="btn btn-ghost">About Me</a>
        <a class="btn btn-ghost">Get in Touch</a>
      </div>
    </div>
  </section>

  <section class="fake-section">Projects section</section>
  <section class="fake-section">About section</section>
  <section class="fake-section">Contact section</section>

  <!-- The name that actually animates — driven entirely by JS -->
  <div class="name-animated" aria-label="Artem Gusev">Artem Gusev</div>

  <script>
    const animatedName = document.querySelector('.name-animated');
    const placeholder  = document.querySelector('.name-placeholder');
    const anchor       = document.querySelector('.logo-anchor');
    const hero         = document.getElementById('hero');
    const header       = document.getElementById('header');
    const heroTitle    = document.querySelector('.hero-title');
    const ctaGroup     = document.querySelector('.cta-group');

    // Parse hex to [r, g, b]
    function hexToRgb(hex) {
      return [
        parseInt(hex.slice(1, 3), 16),
        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16),
      ];
    }

    function lerpColor(hex1, hex2, t) {
      const [r1, g1, b1] = hexToRgb(hex1);
      const [r2, g2, b2] = hexToRgb(hex2);
      return `rgb(${
        Math.round(r1 + (r2 - r1) * t)},${
        Math.round(g1 + (g2 - g1) * t)},${
        Math.round(b1 + (b2 - b1) * t)})`;
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    // Measured once after fonts load — these are the fixed reference points
    let startLeft, startTop, startSize;
    let endLeft, endTop, endSize;

    function measure() {
      const pRect = placeholder.getBoundingClientRect();
      const aRect = anchor.getBoundingClientRect();

      startLeft = pRect.left;
      startTop  = pRect.top;
      startSize = parseFloat(getComputedStyle(placeholder).fontSize);

      endLeft = aRect.left;
      endTop  = aRect.top;
      endSize = parseFloat(getComputedStyle(anchor).fontSize);
    }

    function update() {
      const scrollY = window.scrollY;

      // Vertical distance the name must travel to reach the logo
      const travelDist = Math.max(1, startTop - endTop);

      // 0 = name at start, 1 = name at logo — drives X, size, color
      const morphProgress = Math.min(1, scrollY / travelDist);

      // Y: name moves up at the same speed as the rest of the content,
      // but clamps once it reaches the logo position
      animatedName.style.top      = Math.max(endTop, startTop - scrollY) + 'px';
      animatedName.style.left     = lerp(startLeft, endLeft, morphProgress) + 'px';
      animatedName.style.fontSize = lerp(startSize, endSize, morphProgress) + 'px';
      animatedName.style.color    = lerpColor('#fdf0e6', '#f4a261', morphProgress);

      // Title + buttons fade over the same scroll distance
      heroTitle.style.opacity = 1 - morphProgress;
      ctaGroup.style.opacity  = 1 - morphProgress;

      const heroRect = hero.getBoundingClientRect();
      header.classList.toggle('scrolled', -heroRect.top > 10);
    }

    // Wait for fonts so measurements are accurate
    document.fonts.ready.then(() => {
      measure();
      update();
      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', () => { measure(); update(); });
    });
  </script>
</body>
</html>
